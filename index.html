<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>社会实践支队 · 专属工作台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--line:#e6eaf2;--text:#1c2430;--muted:#78849a;--primary:#3b6ef5;--primary-d:#2a55cc;--ok:#16a34a;--danger:#e11d48;--r:14px;--h:38px;--hs:30px}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--text);height:var(--h);padding:0 15px;border-radius:10px;font-size:14px;transition:.15s;white-space:nowrap;cursor:pointer;line-height:1}
.btn:hover{background:#f2f5fb}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-d)}
.btn.ghost{background:transparent}.btn.danger{color:var(--danger);border-color:#f6c9d4}
.btn.danger:hover{background:#fef2f4}.btn.sm{height:var(--hs);padding:0 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%}.btn.on{background:#eaf0ff;border-color:#c9d9ff;color:var(--primary)}
.sel{border:1px solid var(--line);background:#fff;border-radius:10px;height:var(--h);padding:0 12px;font-size:14px;outline:none;cursor:pointer}
.sel:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,110,245,.12)}
.field{margin-bottom:14px}.field>label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;outline:none;background:#fff;transition:.15s;height:40px;line-height:38px}
.field textarea{padding:10px 12px;height:auto;line-height:1.5;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,110,245,.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:8px 0 0}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:44px 12px;font-size:14px}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;background:#dbe3f3;color:#fff;font-weight:600;flex:none;width:34px;height:34px;font-size:15px;line-height:1;border:1px solid #eee}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-sm{width:26px;height:26px;font-size:12px}.avatar-xl{width:84px;height:84px;font-size:32px}
.auth-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#eef3ff,#f7f4ff 55%,#eafaf3)}
.auth-card{width:100%;max-width:460px;background:#fff;border-radius:20px;padding:28px;box-shadow:0 24px 60px rgba(40,70,140,.14)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand-logo{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3b6ef5,#8b5cf6);color:#fff;font-weight:700;font-size:20px}
.brand h1{font-size:18px;margin:0}.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:#f2f5fb;padding:4px;border-radius:12px;margin-bottom:20px}
.tab{flex:1;border:none;background:transparent;height:36px;border-radius:9px;font-size:14px;color:var(--muted)}
.tab.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 2px 8px rgba(30,60,120,.08)}
.avatar-picker{display:flex;gap:14px;align-items:flex-start;background:#f8faff;border:1px solid var(--line);border-radius:12px;padding:14px}
.ap-left{flex:none}.ap-right{flex:1;min-width:0}
.ap-label{font-size:12px;color:var(--muted);margin:10px 0 6px}
.ap-colors{display:flex;gap:6px;flex-wrap:wrap}
.dot-color{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.ap-emojis{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.emo{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0}
.emo:hover{background:#eef3ff}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 20px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand-small{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
.brand-small .logo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3b6ef5,#8b5cf6);color:#fff;font-size:14px;font-weight:700}
.nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.nav-btn{position:relative;border:none;background:transparent;height:36px;padding:0 14px;border-radius:10px;font-size:14px;color:var(--muted)}
.nav-btn:hover{background:#f2f5fb;color:var(--text)}.nav-btn.active{background:#eaf0ff;color:var(--primary);font-weight:600}
/* 红点通知 */
.red-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:#e11d48;border-radius:50%;box-shadow:0 0 0 2px #fff;}
.red-dot-text{display:inline-flex;align-items:center;gap:4px;color:#e11d48;font-size:12px;font-weight:500;margin-left:8px}
.user-box{display:flex;align-items:center;gap:8px}
.top-name{font-size:14px;font-weight:500;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:1300px;margin:0 auto;padding:22px 20px 90px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.view-head.mt{margin-top:38px}.view-head h2{font-size:19px;margin:0}
.view-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.entry-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;transition:.18s}
.entry-card:hover{border-color:#c9d9ff;box-shadow:0 8px 20px rgba(40,70,140,.09);transform:translateY(-1px)}
.entry-ic{width:42px;height:42px;border-radius:12px;background:#eef3ff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.entry-t{font-size:14.5px;font-weight:600}.entry-d{font-size:12px;color:var(--muted);margin-top:3px}
.work-layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.doc-panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;position:sticky;top:78px;max-height:calc(100vh - 104px);display:flex;flex-direction:column;gap:12px}
.doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.doc-head h2{font-size:17px;margin:0;display:flex;align-items:center;gap:7px}
.doc-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.doc-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:11px 10px;transition:.15s;background:#fff}
.doc-item:hover{background:#f8faff;border-color:#d5e0f8}
.doc-item .file-icon{width:36px;height:36px;border-radius:9px;font-size:17px}
.doc-info{flex:1;min-width:0}
.doc-name{font-size:13.5px;font-weight:500;line-height:1.4;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc-meta{font-size:11.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-acts{display:flex;gap:4px;flex:none}
.icon-btn{width:var(--hs);height:var(--hs);border-radius:8px;border:1px solid var(--line);background:#fff;color:#51607a;font-size:13px;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:.15s;line-height:1}
.icon-btn:hover{background:#eef3ff;color:var(--primary);border-color:#c9d9ff}
.icon-btn.danger:hover{background:#fef2f4;color:var(--danger);border-color:#f6c9d4}
.task-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.task-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;transition:.18s}
.task-card:hover{box-shadow:0 10px 24px rgba(40,70,140,.08);transform:translateY(-1px)}
.task-card.is-done{opacity:.72;background:#fbfcfe}
.task-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:#eef2fa;color:#51607a;white-space:nowrap}
.chip.group{background:#eaf0ff;color:#3b6ef5}.chip.ok{background:#e8f8ee;color:var(--ok)}
.chip.pending{background:#fff5e5;color:#b8760b}.chip.cat{background:#f2ecff;color:#7c4dff}
.task-title{margin:0;font-size:16px;line-height:1.4;word-break:break-word}
.is-done .task-title{text-decoration:line-through;color:var(--muted)}
.task-desc{margin:0;font-size:13px;color:var(--muted);line-height:1.55;word-break:break-word}
.task-meta{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.task-actions{display:flex;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:#f2f5fb;padding:4px;border-radius:10px;gap:4px;height:var(--h);align-items:center}
.seg-btn{border:none;background:transparent;height:var(--hs);padding:0 14px;border-radius:8px;font-size:13.5px;color:var(--muted)}
.seg-btn.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 2px 6px rgba(30,60,120,.08)}
.album-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:13.5px;min-width:0}
.crumb{border:none;background:transparent;padding:5px 9px;border-radius:8px;color:#51607a;font-size:13.5px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.crumb:hover{background:#eef3ff;color:var(--primary)}
.crumb.cur{color:var(--text);font-weight:600}.crumb.cur:hover{background:transparent}
.crumb-sep{color:#c3cbdc;font-size:12px}
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:18px}
.folder-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:5px}
.folder-card:hover{border-color:#c9d9ff;box-shadow:0 8px 20px rgba(40,70,140,.09);transform:translateY(-1px)}
.folder-card .fic{font-size:25px;line-height:1}
.folder-card .fnm{font-size:13.5px;font-weight:600;word-break:break-all;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.folder-card .fmeta{font-size:11.5px;color:var(--muted)}
.folder-card .fdel{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;border:none;background:transparent;color:#aab3c5;font-size:12px;opacity:0;transition:.15s;line-height:1}
.folder-card:hover .fdel{opacity:1}.folder-card .fdel:hover{background:#fef2f4;color:var(--danger)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ph{position:relative;margin:0;border-radius:12px;overflow:hidden;background:#e9eefa;cursor:pointer;border:1px solid var(--line);transition:.18s}
.ph:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(40,70,140,.12)}
.thumb{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;position:relative}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;text-shadow:0 2px 10px rgba(0,0,0,.5);pointer-events:none}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 9px 7px;font-size:11.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.62));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-fav{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);color:#fff;font-size:14px}
.ph-fav.on{color:#ffc53d;background:rgba(0,0,0,.55)}
.ph-check{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.8);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700}
.ph.selected{outline:3px solid var(--primary);outline-offset:-3px}
.ph.selected .ph-check{background:var(--primary);border-color:var(--primary)}
.multi-bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;background:#1c2430;color:#fff;padding:10px 14px;border-radius:14px;box-shadow:0 14px 34px rgba(20,40,80,.32);font-size:14px;max-width:calc(100% - 24px)}
.multi-bar .btn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.multi-bar .btn:hover{background:rgba(255,255,255,.26)}
.multi-bar .btn.del{background:rgba(225,29,72,.85)}.multi-bar .cnt{white-space:nowrap}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
.table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:1680px}
.table th{background:#f7f9fe;text-align:left;padding:11px 14px;font-weight:600;color:#51607a;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:10px 14px;border-bottom:1px solid #f0f3f9;vertical-align:middle;white-space:nowrap}
.table tr:last-child td{border-bottom:none}
.name-cell{display:flex;align-items:center;gap:8px;font-weight:500}
.row-actions{display:flex;gap:6px}.empty-cell{text-align:center;color:var(--muted);padding:28px}
.file-list{display:flex;flex-direction:column;gap:8px}
.file-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.file-icon{width:38px;height:38px;border-radius:10px;background:#eef3ff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.file-info{flex:1;min-width:0}
.file-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.file-actions{display:flex;gap:6px;flex:none}
.chat-layout{display:grid;grid-template-columns:252px minmax(0,1fr);gap:14px;height:calc(100vh - 200px);min-height:460px}
.chat-side{background:#fff;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.chat-side-actions{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.chat-side-actions .btn{flex:1;padding:0 6px;font-size:13px}
.chat-side-list{flex:1;overflow-y:auto;padding:8px}
.side-sec{font-size:11.5px;color:var(--muted);padding:8px 8px 4px;font-weight:600}
.side-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;cursor:pointer;transition:.15s}
.side-item:hover{background:#f5f8ff}.side-item.active{background:#eaf0ff}
.side-item .si-txt{flex:1;min-width:0}
.side-item .si-name{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-item.active .si-name{font-weight:600;color:var(--primary)}
.side-item .si-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat{display:flex;flex-direction:column;height:100%;min-height:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chat-head{padding:11px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:9px;background:#fff;min-height:46px;flex-wrap:wrap}
.chat-log{flex:1;overflow-y:auto;padding:18px;background:linear-gradient(#fbfcff,#f7f9fe)}
.msg{display:flex;gap:9px;margin-bottom:15px;align-items:flex-start}
.msg.mine{flex-direction:row-reverse}
.bubble-wrap{display:flex;flex-direction:column;max-width:72%;min-width:0}
.msg.mine .bubble-wrap{align-items:flex-end}
.msg-head{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.bubble{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:12px;border-top-left-radius:4px;font-size:14px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
.msg.mine .bubble{background:var(--primary);color:#fff;border-color:var(--primary);border-top-left-radius:12px;border-top-right-radius:4px}
.chat-input{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line);background:#fff;align-items:flex-end}
.chat-input textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 13px;resize:none;outline:none;font-size:14px;max-height:120px;line-height:1.5;min-height:40px}
.chat-input textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,110,245,.12)}
.pick-list{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.pick-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;font-size:13.5px;cursor:pointer}
.pick-item:hover{background:#f5f8ff}.pick-item input{accent-color:var(--primary);width:15px;height:15px;flex:none}
#modalWrap{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-backdrop{position:absolute;inset:0;background:rgba(20,30,50,.45);backdrop-filter:blur(2px)}
.modal{position:relative;background:#fff;border-radius:18px;padding:22px;width:100%;max-width:520px;max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(20,40,80,.28)}
.modal.wide{max-width:820px}
.modal h2{margin:0 0 16px;font-size:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.detail-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed #eef1f7;font-size:14px}
.detail-row:last-child{border-bottom:none}
.detail-row .k{color:var(--muted);width:86px;flex:none}.detail-row .v{flex:1;word-break:break-word}
.lightbox{display:flex;align-items:center;justify-content:center;background:#0d1117;border-radius:12px;overflow:hidden;max-height:66vh}
.lightbox img,.lightbox video{max-width:100%;max-height:66vh;display:block}
.lightbox-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.lightbox-bar .acts{display:flex;gap:8px}
#cropModalWrap{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.6)}
#cropCanvas{width:min(300px,100%);height:auto;aspect-ratio:1/1;background:#eef2fa;touch-action:none;cursor:grab;border-radius:6px}
.crop-ctrl{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-top:14px}
.crop-ctrl input[type=range]{flex:1;accent-color:var(--primary)}
#toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);z-index:9999;background:rgba(28,36,48,.94);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.invite-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:600;letter-spacing:.5px;color:var(--primary)}
.invite-badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px}
.invite-badge.leader{background:#fef3e2;color:#b45309}
.invite-badge.member{background:#eef3ff;color:#3b6ef5}
.invite-badge.used{background:#f1f3f7;color:#94a3b8}

/* ---------- 头像处理 & 裁剪 ---------- */
function openCropModal(file, onDone) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function() {
    var img = new Image();
    img.onload = function() {
      var S = 300, OUT = 256;
      var baseScale = Math.max(S / img.width, S / img.height);
      var zoom = 1, offX = 0, offY = 0, dragging = false;
      var startX = 0, startY = 0, startOffX = 0, startOffY = 0;
      
      var cropDiv = document.createElement('div');
      cropDiv.id = 'cropModalWrap';
      cropDiv.innerHTML = 
        '<div style="background:#fff;padding:20px;border-radius:16px;width:340px">' +
          '<h2 style="margin:0 0 14px;font-size:18px">裁剪头像</h2>' +
          '<div style="display:flex;justify-content:center"><canvas id="cropCanvas" width="'+S+'" height="'+S+'"></canvas></div>' +
          '<div class="crop-ctrl"><span>缩放</span><input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" /></div>' +
          '<p class="sub" style="text-align:center;margin:10px 0 0">拖动图片调整位置，滑动滑块缩放</p>' +
          '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">' +
            '<button class="btn ghost" id="cropCancel">取消</button>' +
            '<button class="btn primary" id="cropOk">确定</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(cropDiv);

      var cv = document.getElementById('cropCanvas'); 
      var ctx = cv.getContext('2d');
      
      function transform() {
        var scale = baseScale * zoom; var dw = img.width * scale, dh = img.height * scale;
        var mx = Math.max(0, (dw - S) / 2), my = Math.max(0, (dh - S) / 2);
        offX = Math.min(mx, Math.max(-mx, offX)); offY = Math.min(my, Math.max(-my, offY));
        return { dw:dw, dh:dh, x:S/2-dw/2+offX, y:S/2-dh/2+offY };
      }
      function draw() {
        var t = transform(); ctx.clearRect(0,0,S,S); ctx.save();
        ctx.beginPath(); ctx.arc(S/2,S/2,S/2,0,Math.PI*2); ctx.clip();
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,S,S); ctx.drawImage(img,t.x,t.y,t.dw,t.dh);
        ctx.restore();
        ctx.beginPath(); ctx.arc(S/2,S/2,S/2-1,0,Math.PI*2);
        ctx.strokeStyle = 'rgba(59,110,245,.85)'; ctx.lineWidth = 2; ctx.stroke();
      }
      draw();
      
      cv.addEventListener('pointerdown', function(e) {
        dragging = true; startX = e.clientX; startY = e.clientY; startOffX = offX; startOffY = offY;
        try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      });
      cv.addEventListener('pointermove', function(e) {
        if (!dragging) return;
        var rect = cv.getBoundingClientRect(); var k = S / rect.width;
        offX = startOffX + (e.clientX - startX) * k; offY = startOffY + (e.clientY - startY) * k; draw();
      });
      function stop() { dragging = false; }
      cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop); cv.addEventListener('pointerleave', stop);
      
      document.getElementById('cropZoom').addEventListener('input', function(e) { zoom = parseFloat(e.target.value); draw(); });
      document.getElementById('cropCancel').addEventListener('click', function() { document.body.removeChild(cropDiv); });
      document.getElementById('cropOk').addEventListener('click', function() {
        var t = transform(); var out = document.createElement('canvas'); out.width = out.height = OUT;
        var octx = out.getContext('2d'); var k = OUT / S; octx.save();
        octx.beginPath(); octx.arc(OUT/2,OUT/2,OUT/2,0,Math.PI*2); octx.clip();
        octx.fillStyle = '#fff'; octx.fillRect(0,0,OUT,OUT);
        octx.drawImage(img,t.x*k,t.y*k,t.dw*k,t.dh*k); octx.restore();
        var data = out.toDataURL('image/jpeg', 0.9); 
        document.body.removeChild(cropDiv);
        onDone(data);
      });
    };
    img.onerror = function() { toast('图片读取失败'); };
    img.src = reader.result;
  };
  reader.onerror = function() { toast('文件读取失败'); };
  reader.readAsDataURL(file);
}

function setAvatar(el, avatar, name) {
  if (!el) return; el.innerHTML = ''; el.style.background = ''; el.style.color = '#fff';
  if (avatar && avatar.kind === 'image' && avatar.data) el.innerHTML = '<img src="'+avatar.data+'" alt="" />';
  else if (avatar && avatar.kind === 'gen') { 
    el.style.background = avatar.color || '#3b6ef5'; 
    if(avatar.color === '#FFFFFF') el.style.color = '#333';
    el.textContent = avatar.emoji || (name ? name[0] : '?'); 
  }
  else { el.style.background = '#3b6ef5'; el.textContent = name ? name[0] : '?'; }
}
function avatarHTML(name, avatar, sizeClass) {
  sizeClass = sizeClass || 'avatar-sm';
  if (avatar && avatar.kind === 'image' && avatar.data) return '<span class="avatar '+sizeClass+'"><img src="'+avatar.data+'" alt="" /></span>';
  if (avatar && avatar.kind === 'gen') {
    var color = avatar.color || '#3b6ef5';
    var textColor = color === '#FFFFFF' ? '#333' : '#fff';
    return '<span class="avatar '+sizeClass+'" style="background:'+color+';color:'+textColor+'">'+(avatar.emoji || (name?name[0]:'?'))+'</span>';
  }
  return '<span class="avatar '+sizeClass+'" style="background:#3b6ef5">'+(name ? name[0] : '?')+'</span>';
}

/* ---------- 数据加载与通知检测 ---------- */
async function fetchAllData() {
  try {
    const [tasksRes, membersRes, docsRes, foldersRes, photosRes, filesRes, convsRes, msgsRes, invitesRes] = await Promise.all([
      db.from('tasks').select('*').order('created_at', { ascending: false }),
      db.from('members').select('*'),
      db.from('docs').select('*').order('created_at', { ascending: false }),
      db.from('folders').select('*'),
      db.from('photos').select('*').order('created_at', { ascending: false }),
      db.from('files').select('*').order('created_at', { ascending: false }),
      db.from('conversations').select('*'),
      db.from('messages').select('*').order('created_at', { ascending: true }),
      db.from('invite_codes').select('*').order('created_at', { ascending: false })
    ]);

    DB.tasks = tasksRes.data || [];
    DB.members = membersRes.data || [];
    DB.docs = docsRes.data || [];
    DB.folders = foldersRes.data || [];
    DB.photos = photosRes.data || [];
    DB.files = filesRes.data || [];
    DB.conversations = convsRes.data || [];
    DB.messages = msgsRes.data || [];
    DB.inviteCodes = invitesRes.data || [];

    checkNotifications();
  } catch (err) {
    console.error("拉取数据时发生严重崩溃:", err);
  }
}

function checkNotifications() {
  if (!me) return;
  var hasNewTasks = DB.tasks.some(function(t) {
    return new Date(t.created_at).getTime() > lastReadTasks && 
           (t.group_name === '全部组别' || t.group_name === me.group_name);
  });
  var hasNewDocs = DB.docs.some(function(d) {
    return new Date(d.created_at).getTime() > lastReadDocs;
  });

  if (hasNewTasks) {
    $('#dotTasks').hidden = false;
    $('#unreadTasksText').hidden = false;
  } else {
    $('#dotTasks').hidden = true;
    $('#unreadTasksText').hidden = true;
  }
  
  if (hasNewDocs) {
    $('#unreadDocsText').hidden = false;
  } else {
    $('#unreadDocsText').hidden = true;
  }

  if (hasNewTasks || hasNewDocs) {
    $('#noticeBox').hidden = false;
    var msg = [];
    if (hasNewTasks) msg.push('有新的任务分配给您所在的组别');
    if (hasNewDocs) msg.push('文档中心有新文件上传');
    $('#noticeText').textContent = msg.join('，');
  } else {
    $('#noticeBox').hidden = true;
  }
}

function markTasksRead() {
  lastReadTasks = Date.now();
  localStorage.setItem('lastReadTasks', lastReadTasks);
  $('#dotTasks').hidden = true;
  $('#unreadTasksText').hidden = true;
  checkNotifications(); // 重新计算是否还有其他通知
}
function markDocsRead() {
  lastReadDocs = Date.now();
  localStorage.setItem('lastReadDocs', lastReadDocs);
  $('#unreadDocsText').hidden = true;
  checkNotifications();
}

/* ---------- 登录 / 注册 ---------- */
function bindAuthTabs() {
  $$('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      $$('.tab').forEach(function(t) { t.classList.toggle('active', t === tab); });
      var isLogin = tab.dataset.tab === 'login';
      $('#loginForm').hidden = !isLogin; $('#registerForm').hidden = isLogin;
    });
  });
}

function bindAuthForms() {
  $('#loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var name = $('#loginName').value.trim(); var pass = $('#loginPass').value; var errEl = $('#loginErr');
    errEl.textContent = ''; if (!name || !pass) { errEl.textContent = '请填写用户名和密码'; return; }
    
    $('#btnLoginSubmit').textContent = '登录中...'; $('#btnLoginSubmit').disabled = true;
    const { data: authData, error } = await db.auth.signInWithPassword({ email: getFakeEmail(name), password: pass });
    if (error) { errEl.textContent = '用户名或密码错误'; $('#btnLoginSubmit').textContent = '登录'; $('#btnLoginSubmit').disabled = false; return; }

    await fetchAllData();
    const myMember = DB.members.find(m => m.user_id === authData.user.id);
    if (!myMember) { errEl.textContent = '未找到成员信息，请重新注册'; return; }

    var avatarData = null;
    if (myMember.avatar_url) { try { avatarData = JSON.parse(myMember.avatar_url); } catch(e) {} }
    me = { id: authData.user.id, name: myMember.name, role: myMember.role, group_name: myMember.group_name, avatar: avatarData || {kind:'gen', color:'#3b6ef5', emoji:''} };

    $('#btnLoginSubmit').textContent = '登录'; $('#btnLoginSubmit').disabled = false;
    startApp();
  });

  $('#registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var name = $('#regName').value.trim(); var pass = $('#regPass').value; var codeVal = $('#regCode').value.trim().toUpperCase();
    var errEl = $('#regErr'); errEl.textContent = '';
    
    if (name.length < 2 || name.length > 16) { errEl.textContent = '用户名需为 2-16 个字符'; return; }
    if (pass.length < 4) { errEl.textContent = '密码至少 4 位'; return; }
    if (!codeVal) { errEl.textContent = '请填写注册密钥'; return; }

    $('#btnRegSubmit').textContent = '注册中...'; $('#btnRegSubmit').disabled = true;

    const { data: invite, error: invErr } = await db.from('invite_codes').select('*').eq('code', codeVal).eq('used', false).eq('voided', false).maybeSingle();
    if (invErr) { errEl.textContent = '查询错误: ' + invErr.message; $('#btnRegSubmit').textContent = '注册并进入'; $('#btnRegSubmit').disabled = false; return; }
    if (!invite) { errEl.textContent = '注册密钥无效或已被使用'; $('#btnRegSubmit').textContent = '注册并进入'; $('#btnRegSubmit').disabled = false; return; }

    const { data: authData, error: authErr } = await db.auth.signUp({ email: getFakeEmail(name), password: pass });
    if (authErr) { 
      if(authErr.message.includes('already registered')) errEl.textContent = '该用户名已被占用，请换一个用户名'; 
      else errEl.textContent = authErr.message; 
      $('#btnRegSubmit').textContent = '注册并进入'; $('#btnRegSubmit').disabled = false; return; 
    }

    const role = invite.role === 'leader' ? '支队长' : '支队员';
    const avatarStr = regAvatar ? JSON.stringify(regAvatar) : '';
    
    const { error: memErr } = await db.from('members').insert({
      user_id: authData.user.id, name: name, role: role, group_name: GROUPS[0], avatar_url: avatarStr
    });
    
    if (memErr) { errEl.textContent = '创建成员信息失败: ' + memErr.message; $('#btnRegSubmit').textContent = '注册并进入'; $('#btnRegSubmit').disabled = false; return; }

    await db.from('invite_codes').update({ used: true, used_by: name, used_at: new Date().toISOString() }).eq('id', invite.id);

    await fetchAllData();
    me = { id: authData.user.id, name: name, role: role, group_name: GROUPS[0], avatar: regAvatar || {kind:'gen', color:'#3b6ef5', emoji:''} };
    toast('注册成功，欢迎加入！');
    $('#btnRegSubmit').textContent = '注册并进入'; $('#btnRegSubmit').disabled = false;
    startApp();
  });
}

function switchView(v) {

  if (v === 'tasks') markTasksRead();
  if (v === 'tasks' && currentView === 'tasks') markDocsRead(); // 文档在工作中心里

function renderCurrentView() {
  if (!me) return;
  if (currentView === 'tasks') { renderTasks(); renderDocs(); }

}

/* ---------- 任务模块 ---------- */
function buildGroupFilter() {
  var sel = $('#taskGroupFilter'); sel.innerHTML = '<option value="all">全部组别</option>' + GROUPS.map(function(g) { return '<option value="'+g+'">'+g+'</option>'; }).join('');
}
function renderTasks() {
  var list = $('#taskList'); var items = DB.tasks.slice();
  if (taskFilter.status !== 'all') items = items.filter(function(t) { return t.status === taskFilter.status; });
  if (taskFilter.group !== 'all') items = items.filter(function(t) { return t.group_name === taskFilter.group; });
  $('#taskSummary').textContent = '共 '+DB.tasks.length+' 个任务';
  if (!items.length) { list.innerHTML = '<div class="empty">暂无任务</div>'; return; }
  list.innerHTML = items.map(function(t) {
    var meta = t.status === 'done' ? {label:'已完成', cls:'ok'} : t.status === 'pending' ? {label:'待批复', cls:'pending'} : {label:'待完成', cls:'pending'};
    var acts = '<button class="btn ghost sm" data-act="detail" data-id="'+t.id+'">详情</button>';
    if (t.status === 'todo') acts += '<button class="btn primary sm" data-act="submit" data-id="'+t.id+'">完成任务</button>';
    if (isManager()) acts += '<button class="btn danger sm" data-act="del" data-id="'+t.id+'">删除</button>';
    return '<article class="task-card '+(t.status==='done'?'is-done':'')+'">' +
      '<div class="task-top"><span class="chip group">'+esc(t.group_name||'未分组')+'</span><span class="chip '+meta.cls+'">'+meta.label+'</span></div>' +
      '<h3 class="task-title">'+esc(t.title)+'</h3><p class="task-desc">'+esc((t.description||'').slice(0,90))+'</p>' +
      '<div class="task-actions">'+acts+'</div></article>';
  }).join('');
}
function bindTaskEvents() {
  $('#taskStatusFilter').addEventListener('change', function(e) { taskFilter.status = e.target.value; renderTasks(); });
  $('#taskGroupFilter').addEventListener('change', function(e) { taskFilter.group = e.target.value; renderTasks(); });
  
  $('#taskList').addEventListener('click', async function(e) {
    var btn = e.target.closest('button[data-act]'); if (!btn) return;
    var id = btn.dataset.id; var task = DB.tasks.find(t => t.id === id);
    
    if (btn.dataset.act === 'submit') {
      await db.from('tasks').update({ status: 'pending', submitted_by: me.name, submitted_at: new Date().toISOString() }).eq('id', id);
      toast('已提交'); await fetchAllData(); renderTasks();
    }
    if (btn.dataset.act === 'del') {
      if (!confirm('确定删除？')) return;
      await db.from('tasks').delete().eq('id', id);
      toast('已删除'); await fetchAllData(); renderTasks();
    }
    if (btn.dataset.act === 'detail') {
      alert('任务：' + task.title + '\n\n组别：' + task.group_name + '\n负责人：' + task.owner + '\n截止：' + task.due_date + '\n\n描述：' + (task.description || '无'));
    }
  });

  $('#btnNewTask').addEventListener('click', function() {
    openModal('<h2>发布任务</h2>' +
      '<div class="field"><label>任务标题</label><input id="tTitle" placeholder="例如：联系实践接收单位" /></div>' +
      '<div class="field"><label>任务描述</label><textarea id="tDesc" rows="3" placeholder="具体交付标准等"></textarea></div>' +
      '<div class="grid2">' +
        '<div class="field"><label>负责组别</label><select id="tGroup"><option value="全部组别">全部组别</option>'+GROUPS.map(g => '<option>'+g+'</option>').join('')+'</select></div>' +
        '<div class="field"><label>负责人</label><input id="tOwner" value="'+esc(me.name)+'" /></div>' +
      '</div>' +
      '<div class="field"><label>截止日期</label><input id="tDue" type="date" /></div>' +
      '<div class="modal-actions"><button class="btn ghost" data-close>取消</button><button class="btn primary" id="tSave">发布</button></div>');
      
    $('#tSave').addEventListener('click', async function() {
      var title = $('#tTitle').value.trim(); if (!title) return toast('请输入标题');
      await db.from('tasks').insert({ 
        title: title, 
        description: $('#tDesc').value.trim(), 
        group_name: $('#tGroup').value, 
        owner: $('#tOwner').value.trim(), 
        due_date: $('#tDue').value, 
        status: 'todo',

        creator_name: me.name

/* ---------- 文档中心 ---------- */
function renderDocs() {
  var list = $('#docList'); $('#docSummary').textContent = '实践必备文件 · 共 '+DB.docs.length+' 份';
  if (!DB.docs.length) { list.innerHTML = '<div class="empty">暂无文件</div>'; return; }
  list.innerHTML = DB.docs.map(function(d) {
    return '<div class="doc-item"><div class="file-icon">📄</div><div class="doc-info"><div class="doc-name">'+esc(d.name)+'</div>' +
      '<div class="doc-meta">'+esc(d.uploader_name)+'</div></div>' +
      '<a href="'+d.blob_key+'" target="_blank" class="btn sm">下载</a></div>';
  }).join('');

function bindDocEvents() {
  $('#docInput').addEventListener('change', async function(e) {
    var files = e.target.files; if (!files.length) return;
    toast('正在上传到云端...');
    for (var i = 0; i < files.length; i++) {
      var f = files[i]; var path = 'docs/' + Date.now() + '_' + f.name;
      var { data, error } = await db.storage.from('media').upload(path, f);
      if (!error) {
        var { data: urlData } = db.storage.from('media').getPublicUrl(path);

    }
    e.target.value = ''; toast('上传成功'); await fetchAllData(); renderDocs();
  });

/* ---------- 相册模块（支持新建文件夹） ---------- */
function renderAlbum() {
  var content = $('#albumContent');
  
  if (albumState.selectMode) {
    $('#btnMulti').textContent = '取消多选';
    $('#btnMulti').classList.add('on');
    $('#multiBar').hidden = false;
    $('#multiCount').textContent = '已选 ' + albumState.selected.size + ' 项';
  } else {
    $('#btnMulti').textContent = '多选';
    $('#btnMulti').classList.remove('on');
    $('#multiBar').hidden = true;
  }

  // 渲染面包屑
  if (albumState.filter === 'fav') {
    $('#albumCrumbs').innerHTML = '<button class="crumb" data-crumb="root">🏠 根目录</button><span class="crumb-sep">/</span><span class="crumb cur">⭐ 收藏</span>';
  } else if (albumState.currentFolderId) {
    var f = DB.folders.find(x => x.id === albumState.currentFolderId);
    $('#albumCrumbs').innerHTML = '<button class="crumb" data-crumb="root">🏠 根目录</button><span class="crumb-sep">/</span><span class="crumb cur">📁 ' + (f ? esc(f.name) : '未知') + '</span>';
  } else {
    $('#albumCrumbs').innerHTML = '<button class="crumb cur">🏠 根目录</button>';
  }

  var html = '';

  // 渲染文件夹 (如果在根目录且不在收藏模式)
  if (albumState.filter === 'all' && !albumState.currentFolderId) {
    var folders = DB.folders || [];
    if (folders.length > 0) {
      html += '<div class="folder-grid">' + folders.map(function(f) {
        return '<div class="folder-card" data-fid="'+f.id+'">' +
          '<div class="fic">📁</div>' +
          '<div class="fnm">'+esc(f.name)+'</div>' +
          '<div class="fmeta">点击进入</div>' +
          '<button class="fdel" data-del-fid="'+f.id+'">✕</button>' +
        '</div>';
      }).join('') + '</div>';
    }
  }

  // 渲染照片
  var items = DB.photos.slice();
  if (albumState.filter === 'fav') items = items.filter(p => p.fav);
  else if (albumState.currentFolderId) items = items.filter(p => p.folder_id === albumState.currentFolderId);
  else items = items.filter(p => !p.folder_id); // 根目录只显示没有文件夹的照片

  if (items.length > 0) {
    html += '<div class="gallery">' + items.map(function(p) {
      var selected = albumState.selected.has(p.id) ? 'selected' : '';
      return '<figure class="ph ' + selected + '" data-id="'+p.id+'">' +
        '<div class="thumb"><img src="'+p.blob_key+'" /></div>' +
        (albumState.selectMode 
          ? '<div class="ph-check">'+(selected ? '✓' : '')+'</div>' 
          : '<div class="ph-fav '+(p.fav?'on':'')+'" data-act="fav" data-id="'+p.id+'">★</div>') +
        '<figcaption>'+esc(p.uploader_name || '未知')+'</figcaption>' +
      '</figure>';
    }).join('') + '</div>';
  }

  if (!html) {
    html = '<div class="empty">该目录下暂无内容</div>';
  }

  content.innerHTML = html;
  $('#albumSummary').textContent = '共 ' + DB.photos.length + ' 个媒体 · ' + (DB.folders ? DB.folders.length : 0) + ' 个文件夹';
}

function bindAlbumEvents() {
  // 筛选
  $$('#albumSeg .seg-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      $$('#albumSeg .seg-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      albumState.filter = btn.dataset.filter;
      albumState.currentFolderId = null; // 切换筛选重置文件夹
      renderAlbum();
    });
  });

  // 面包屑导航
  $('#albumCrumbs').addEventListener('click', function(e) {
    var crumb = e.target.closest('[data-crumb]');
    if (crumb) {
      albumState.currentFolderId = null;
      renderAlbum();
    }
  });

  // 新建文件夹
  $('#btnNewFolder').addEventListener('click', function() {
    openModal('<h2>新建文件夹</h2>' +
      '<div class="field"><label>文件夹名称</label><input id="folderName" placeholder="例如：调研现场" /></div>' +
      '<div class="modal-actions"><button class="btn ghost" data-close>取消</button><button class="btn primary" id="folderSave">创建</button></div>');
    $('#folderSave').addEventListener('click', async function() {
      var name = $('#folderName').value.trim(); if (!name) return toast('请输入名称');
      await db.from('folders').insert({ name: name, created_by: me.id });
      closeModal(); toast('文件夹已创建'); await fetchAllData(); renderAlbum();
    });
  });

  // 上传照片
  $('#photoInput').addEventListener('change', async function(e) {
    var files = e.target.files; if (!files.length) return;
    for (var i = 0; i < files.length; i++) {
      var f = files[i]; var path = 'photos/' + Date.now() + '_' + f.name;
      toast('正在上传 ' + f.name + '...');
      const { data: uploadData, error: uploadErr } = await db.storage.from('media').upload(path, f);
      if (uploadErr) { alert('网盘上传失败: ' + uploadErr.message); continue; }
      const { data: urlData } = db.storage.from('media').getPublicUrl(path);
      await db.from('photos').insert({ 
        name: f.name, kind: 'image', blob_key: urlData.publicUrl, 
        uploader_id: me.id, uploader_name: me.name,
        folder_id: albumState.currentFolderId || null // 绑定文件夹
      });
    }
    e.target.value = ''; await fetchAllData(); renderAlbum(); toast('上传成功');
  });

  // 内容区域点击
  $('#albumContent').addEventListener('click', async function(e) {
    // 删除文件夹
    var delBtn = e.target.closest('.fdel');
    if (delBtn) {
      e.stopPropagation();
      if (!confirm('删除文件夹？（里面的照片会回到根目录）')) return;
      await db.from('folders').delete().eq('id', delBtn.dataset.delFid);
      await db.from('photos').update({ folder_id: null }).eq('folder_id', delBtn.dataset.delFid);
      await fetchAllData(); renderAlbum(); return;
    }

    // 进入文件夹
    var folderCard = e.target.closest('.folder-card');
    if (folderCard) {
      albumState.currentFolderId = folderCard.dataset.fid;
      renderAlbum(); return;
    }

    // 图片收藏
    var favBtn = e.target.closest('.ph-fav');
    if (favBtn) {
      e.stopPropagation();
      var pId = favBtn.dataset.id;
      var p = DB.photos.find(x => x.id === pId);
      if (p) { p.fav = !p.fav; db.from('photos').update({fav: p.fav}).eq('id', pId).then(() => renderAlbum()); }
      return;
    }

    // 图片选中/预览
    var fig = e.target.closest('.ph');
    if (!fig) return;
    var pId = fig.dataset.id;

    if (albumState.selectMode) {
      if (albumState.selected.has(pId)) albumState.selected.delete(pId);
      else albumState.selected.add(pId);
      renderAlbum();
    } else {
      var p = DB.photos.find(x => x.id === pId);
      if (p) window.open(p.blob_key, '_blank');
    }
  });

  // 多选操作
  $('#btnMulti').addEventListener('click', function() {
    albumState.selectMode = !albumState.selectMode;
    albumState.selected.clear();
    renderAlbum();
  });
  $('#multiCancel').addEventListener('click', function() {
    albumState.selectMode = false; renderAlbum();
  });
  $('#multiAll').addEventListener('click', function() {
    var items = DB.photos;
    if (albumState.filter === 'fav') items = items.filter(p => p.fav);
    else if (albumState.currentFolderId) items = items.filter(p => p.folder_id === albumState.currentFolderId);
    else items = items.filter(p => !p.folder_id);
    
    if (albumState.selected.size === items.length) albumState.selected.clear();
    else items.forEach(p => albumState.selected.add(p.id));
    renderAlbum();
  });
  $('#multiDelete').addEventListener('click', async function() {
    if (!albumState.selected.size) return toast('请先勾选');
    if (!confirm('确定删除选中的 ' + albumState.selected.size + ' 张图片？')) return;
    for (let id of albumState.selected) { await db.from('photos').delete().eq('id', id); }
    albumState.selected.clear(); albumState.selectMode = false; await fetchAllData(); renderAlbum();
  });
  $('#multiDownload').addEventListener('click', function() {
    if (!albumState.selected.size) return toast('请先勾选');
    for (let id of albumState.selected) {
      var p = DB.photos.find(x => x.id === id);
      if (p) { var a = document.createElement('a'); a.href = p.blob_key; a.target = '_blank'; a.download = p.name; a.click(); }
    }
  });
}

      '<td>'+esc(m.id_card||'-')+'</td>' +
      '<td>'+esc(m.phone||'-')+'</td>' +
      '<td>'+esc(m.emergency_name||'-')+'</td>' +
      '<td>'+esc(m.emergency_phone||'-')+'</td>' +
      '<td><div class="row-actions">'+acts+'</div></td>' +
    '</tr>';
  }).join('');
  
  tbody.querySelectorAll('button[data-act="edit"]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var m = DB.members.find(x => x.id === btn.dataset.id);
      if (canEditMember(m)) openMemberModal(m); // 传入指定成员
    });
  });
}
function bindMemberEvents() {
  $('#btnExportMembers').addEventListener('click', function() { toast('导出功能暂略'); });
}

/* ---------- 聊天模块（支持私聊） ---------- */
function renderChat() {
  var html = '';
  
  // 群聊
  var groups = DB.conversations.filter(c => c.type === 'group' || !c.type);
  html += '<div class="side-sec">群聊</div>';
  groups.forEach(function(c) {
    html += '<div class="side-item '+(c.id===currentChatId?'active':'')+'" data-cid="'+c.id+'"><div class="si-txt"><div class="si-name">'+esc(c.name || '支队群聊')+'</div></div></div>';
  });

  // 私聊
  var privates = DB.conversations.filter(c => c.type === 'private' && (c.member_ids || '').includes(me.id));
  html += '<div class="side-sec">私聊</div>';
  if (privates.length === 0) {
    html += '<div class="sub" style="padding:8px;font-size:12px">暂无私聊</div>';
  }
  privates.forEach(function(c) {
    var otherId = (c.member_ids || '').split(',').find(id => id !== me.id);
    var other = DB.members.find(m => m.user_id === otherId);
    var name = other ? other.name : '未知用户';
    html += '<div class="side-item '+(c.id===currentChatId?'active':'')+'" data-cid="'+c.id+'"><div class="si-txt"><div class="si-name">'+esc(name)+'</div></div></div>';
  });
  
  $('#chatSideList').innerHTML = html;
  
  var msgs = DB.messages.filter(function(m) { return m.conversation_id === currentChatId; });
  $('#chatLog').innerHTML = msgs.map(function(m) {
    return '<div class="msg '+(m.user_id===me.id?'mine':'')+'"><div class="bubble-wrap"><div class="msg-head">'+esc(m.user_name)+'</div><div class="bubble">'+esc(m.text)+'</div></div></div>';
  }).join('');
  $('#chatLog').scrollTop = $('#chatLog').scrollHeight;
}
function bindChatEvents() {
  $('#chatSideList').addEventListener('click', function(e) {
    var item = e.target.closest('.side-item'); if (item) { currentChatId = item.dataset.cid; renderChat(); }
  });
  $('#btnSend').addEventListener('click', async function() {
    var text = $('#chatText').value.trim(); if (!text) return;
    $('#chatText').value = '';
    await db.from('messages').insert({ conversation_id: currentChatId, user_id: me.id, user_name: me.name, text: text });
    await fetchAllData(); renderChat();
  });
  
  $('#btnNewPrivate').addEventListener('click', function() {
    var others = DB.members.filter(m => m.user_id && m.user_id !== me.id);
    if (!others.length) return toast('暂无其他成员');
    openModal('<h2>发起私聊</h2>' +
      '<div class="field"><label>选择成员</label><div class="pick-list">' +
      others.map(u => '<label class="pick-item"><input type="radio" name="pUser" value="'+u.user_id+'" /> '+esc(u.name)+'</label>').join('') +
      '</div></div>' +
      '<div class="modal-actions"><button class="btn ghost" data-close>取消</button><button class="btn primary" id="pSave">开始聊天</button></div>');
    $('#pSave').addEventListener('click', async function() {
      var sel = $('input[name="pUser"]:checked');
      if (!sel) return toast('请选择一位成员');
      var targetId = sel.value;
      var convId = 'private_' + [me.id, targetId].sort().join('_');
      
      var existing = DB.conversations.find(c => c.id === convId);
      if (!existing) {
        await db.from('conversations').insert({
          id: convId, type: 'private', name: '私聊', member_ids: me.id + ',' + targetId, created_by: me.id
        });
        await fetchAllData();
      }
      currentChatId = convId;
      closeModal(); renderChat();
    });
  });
}

/* ---------- 邀请码管理 ---------- */
function openInviteModal() {
  if (!isLeader()) return;
  openModal('<h2>邀请码管理</h2><div class="doc-list">' + DB.inviteCodes.map(function(c) {
    return '<div class="doc-item"><div class="invite-code">'+c.code+'</div><span style="margin-left:auto">'+(c.used?'已用':'可用')+'</span></div>';
  }).join('') + '</div><div class="modal-actions"><button class="btn primary" id="genCode">生成新码</button></div>');
  $('#genCode').addEventListener('click', async function() {
    var code = 'TJ-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    await db.from('invite_codes').insert({ code: code, role: 'member', used: false, voided: false });
    await fetchAllData(); openInviteModal(); toast('已生成：' + code);
  });
}

/* ---------- 资料编辑（支队长可编辑他人） ---------- */
function openMemberModal(member) {
  if (!canEditMember(member)) return toast('无权限编辑');
  var isSelf = member.user_id === me.id;
  var tempAvatar = member.avatar_url ? JSON.parse(member.avatar_url) : {kind:'gen', color:'#3b6ef5', emoji:''};

  openModal(
    '<h2>' + (isSelf ? '我的资料' : '编辑成员信息') + '</h2>' +
    '<div class="avatar-picker" style="margin-bottom:16px">' +
      '<div class="ap-left"><div class="avatar avatar-xl" id="pfPreview"></div></div>' +
      '<div class="ap-right">' +
        '<label class="btn sm">上传图片（可裁剪）<input type="file" id="pfFile" accept="image/*" hidden /></label>' +
        '<div class="ap-label">或挑一个定制头像</div>' +
        '<div class="ap-colors" id="pfColors"></div>' +
        '<div class="ap-emojis" id="pfEmojis"></div>' +
      '</div>' +
    '</div>' +
    '<div class="grid2">' +
      '<div class="field"><label>姓名 *</label><input id="pfName" value="'+esc(member.name)+'" /></div>' +
      '<div class="field"><label>组别</label><select id="pfGroup">'+GROUPS.map(g => '<option '+(g===member.group_name?'selected':'')+'>'+g+'</option>').join('')+'</select></div>' +
      '<div class="field"><label>角色</label>' + 
        (canChangeRole() ? '<select id="pfRole">'+ROLES.map(r => '<option '+(r===member.role?'selected':'')+'>'+r+'</option>').join('')+'</select>' : '<input value="'+esc(member.role)+'" readonly style="background:#f5f7fb" />') +
      '</div>' +
      '<div class="field"><label>学校</label><input id="pfSchool" value="'+esc(member.school||'')+'" /></div>' +
      '<div class="field"><label>学院</label><input id="pfCollege" value="'+esc(member.college||'')+'" /></div>' +
      '<div class="field"><label>年级</label><input id="pfGrade" value="'+esc(member.grade||'')+'" /></div>' +
      '<div class="field"><label>专业</label><input id="pfMajor" value="'+esc(member.major||'')+'" /></div>' +
      '<div class="field"><label>学号</label><input id="pfStudentId" value="'+esc(member.student_id||'')+'" /></div>' +
      '<div class="field"><label>民族</label><input id="pfEthnicity" value="'+esc(member.ethnicity||'')+'" /></div>' +
      '<div class="field"><label>政治面貌</label><input id="pfPolitical" value="'+esc(member.political||'')+'" /></div>' +
      '<div class="field"><label>身份证号</label><input id="pfIdCard" value="'+esc(member.id_card||'')+'" /></div>' +
      '<div class="field"><label>手机</label><input id="pfPhone" value="'+esc(member.phone||'')+'" /></div>' +
      '<div class="field"><label>紧急联系人</label><input id="pfEmergencyName" value="'+esc(member.emergency_name||'')+'" /></div>' +
      '<div class="field"><label>紧急联系方式</label><input id="pfEmergencyPhone" value="'+esc(member.emergency_phone||'')+'" /></div>' +
      '<div class="field" style="grid-column:1/-1"><label>备注</label><input id="pfNote" value="'+esc(member.note||'')+'" /></div>' +
    '</div>' +
    '<div class="modal-actions"><button class="btn ghost" data-close>取消</button><button class="btn primary" id="pfSave">保存</button></div>',
    { wide: true }
  );

  var preview = $('#pfPreview');
  var paint = function() { setAvatar(preview, tempAvatar, $('#pfName').value.trim() || '未知'); };
  paint();

  $('#pfColors').innerHTML = AP_COLORS.map(function(c) { return '<button type="button" class="dot-color" data-color="'+c+'" style="background:'+c+'"></button>'; }).join('');
  $('#pfEmojis').innerHTML = AP_EMOJIS.map(function(e) { return '<button type="button" class="emo" data-emoji="'+e+'">'+e+'</button>'; }).join('');

  $('#pfColors').addEventListener('click', function(e) {
    var b = e.target.closest('.dot-color'); if (!b) return;
    tempAvatar = { kind:'gen', color:b.dataset.color, emoji:(tempAvatar && tempAvatar.emoji) || '' }; paint();
  });
  $('#pfEmojis').addEventListener('click', function(e) {
    var b = e.target.closest('.emo'); if (!b) return;
    tempAvatar = { kind:'gen', color:(tempAvatar && tempAvatar.color) || AP_COLORS[0], emoji:b.dataset.emoji }; paint();
  });
  $('#pfFile').addEventListener('change', function(e) {
    var f = e.target.files[0]; e.target.value = ''; if (!f) return;
    openCropModal(f, function(data) { tempAvatar = { kind:'image', data:data }; paint(); });
  });
  $('#pfName').addEventListener('input', paint);

  $('#pfSave').addEventListener('click', async function() {
    var payloadName = $('#pfName').value.trim();
    if (!payloadName) return toast('请填写姓名');
    
    $('#pfSave').textContent = '保存中...'; $('#pfSave').disabled = true;

    var updateData = {
      name: payloadName,
      group_name: $('#pfGroup').value,
      school: $('#pfSchool').value.trim(),
      college: $('#pfCollege').value.trim(),
      grade: $('#pfGrade').value.trim(),
      major: $('#pfMajor').value.trim(),
      student_id: $('#pfStudentId').value.trim(),
      ethnicity: $('#pfEthnicity').value.trim(),
      political: $('#pfPolitical').value.trim(),
      id_card: $('#pfIdCard').value.trim(),
      phone: $('#pfPhone').value.trim(),
      emergency_name: $('#pfEmergencyName').value.trim(),
      emergency_phone: $('#pfEmergencyPhone').value.trim(),
      note: $('#pfNote').value.trim(),
      avatar_url: JSON.stringify(tempAvatar)
    };

    if (canChangeRole() && $('#pfRole')) {
      updateData.role = $('#pfRole').value;
    }

    // 使用 id 更新，保证支队长可以改别人的
    var { error } = await db.from('members').update(updateData).eq('id', member.id);

    if (error) {
      toast('保存失败: ' + error.message);
      $('#pfSave').textContent = '保存'; $('#pfSave').disabled = false;
      return;
    }

    if (isSelf) {
      me.name = payloadName;
      me.avatar = tempAvatar;
      if (updateData.role) me.role = updateData.role;
    }
    
    await fetchAllData();
    refreshTopbar();
    closeModal();
    toast('资料已更新 ✅');
    renderMembers();
  });
}

/* ---------- 初始化流程 ---------- */
async function init() {
  bindAuthTabs(); bindAuthForms(); bindTopbar(); bindTaskEvents(); bindDocEvents(); bindAlbumEvents(); bindMemberEvents(); bindChatEvents();
  bindAvatarPicker();

  const { data: { session } } = await db.auth.getSession();
  if (session) {
    await fetchAllData();
    const myMember = DB.members.find(m => m.user_id === session.user.id);
    if (myMember) {
      var avatarData = null;
      if (myMember.avatar_url) { try { avatarData = JSON.parse(myMember.avatar_url); } catch(e){} }
      me = { id: session.user.id, name: myMember.name, role: myMember.role, group_name: myMember.group_name, avatar: avatarData || {kind:'gen', color:'#3b6ef5', emoji:''} };
      startApp();
      return;
    }
  }
  $('#authView').hidden = false; $('#appView').hidden = true;
}

init();
</script>
